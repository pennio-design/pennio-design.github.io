<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form activation | PENNIO</title>
<meta name="robots" content="noindex, nofollow">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050505;color:#fff;font-family:system-ui,sans-serif;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px}
main{width:100%;max-width:420px}
h1{font-size:1.5rem;margin-bottom:12px}
p{font-size:.9rem;line-height:1.6;color:rgba(255,255,255,.7);margin-bottom:20px}
input,textarea{width:100%;min-height:44px;margin-bottom:12px;padding:10px 12px;background:#121212;border:1px solid rgba(255,255,255,.2);color:#fff;font:inherit;border-radius:4px}
button{min-height:44px;padding:0 24px;background:#F26522;color:#fff;border:0;font:inherit;font-weight:600;cursor:pointer;border-radius:4px}
</style>
</head>
<body>
<main>
<h1>One-time form activation</h1>
<p>Send one message. FormSubmit will email contact@pennio.agency a confirmation link. This page is temporary.</p>
<form action="https://formsubmit.co/contact@pennio.agency" method="POST">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_subject" value="PENNIO form activation test">
<input type="text" name="name" placeholder="Name" required>
<input type="email" name="email" placeholder="Email" required>
<textarea name="message" rows="3" placeholder="Message" required>Activation test.</textarea>
<button type="submit">Send</button>
</form>
</main>
</body>
</html>
